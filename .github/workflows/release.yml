name: Release

# Al subir un tag vX.Y.Z: comprueba que coincide con mod.version, compila y prueba cada versión de Minecraft y crea una
# release de GitHub con los jars y la sección del CHANGELOG. Todo lo demás es opcional y se activa con variables:
#   Modrinth:    vars.MODRINTH_ID   + secrets.MODRINTH_TOKEN
#   CurseForge:  vars.CURSEFORGE_ID + secrets.CURSEFORGE_TOKEN

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  prepare:
    name: Check tag and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match mod.version
        run: |
          version="$(sed -n 's/^mod\.version *= *"\(.*\)".*/\1/p' stonecutter.properties.toml | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con mod.version ($version) de stonecutter.properties.toml"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Toma la sección "## X.Y.Z ..." (o "## [X.Y.Z]") hasta el siguiente "## "
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1 || index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::CHANGELOG.md no tiene sección para $v; se usan notas genéricas"
            echo "Ver CHANGELOG.md." > notes.md
          fi
          # Las notas de cada release (GitHub, Modrinth y CurseForge) terminan con la autoría
          { echo; echo "Creado por TakumiStudios."; } >> notes.md
          cat notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  validate:
    needs: prepare
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish ${{ matrix.loader }} MC ${{ matrix.minecraft }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.21.1", "26.1.2", "26.2", "26.3"]
        loader: [fabric, forge, neoforge]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.loader == 'fabric' && format('takumi_gate-mc{0}', matrix.minecraft) || format('takumi_gate-{0}-mc{1}', matrix.loader, matrix.minecraft) }}
          path: jars
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Publish to Modrinth / CurseForge
        if: ${{ vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: jars/*.jar
          name: Takumi Gate ${{ github.ref_name }} (${{ matrix.loader }}, MC ${{ matrix.minecraft }})
          version: ${{ github.ref_name }}+mc${{ matrix.minecraft }}-${{ matrix.loader }}
          version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}
          changelog-file: notes.md
          loaders: |
            ${{ matrix.loader }}
            ${{ matrix.loader == 'fabric' && 'quilt' || '' }}
          game-versions: ${{ matrix.minecraft }}
          java: ${{ matrix.minecraft == '1.21.1' && 21 || 25 }}
          dependencies: ${{ matrix.loader == 'fabric' && 'fabric-api(required)' || '' }}

  github-release:
    name: GitHub release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: takumi_gate-*
          path: jars
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "Jars por cargador para Minecraft 1.21.1, 26.1.2, 26.2 y 26.3. Fabric/Quilt requieren Fabric API; Forge y NeoForge tienen jars propios. Consulta README.md para Arclight."
            echo
            cat notes.md
          } > body.md
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" jars/*.jar \
            --title "Takumi Gate $GITHUB_REF_NAME" \
            --notes-file body.md \
            --verify-tag $prerelease
