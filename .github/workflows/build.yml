name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela el run anterior (ahorra minutos y evita dev-releases desordenadas)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: TakumiStudios standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authorship and metadata
        run: |
          node <<'JS'
          const fs = require('fs');
          const metadata = JSON.parse(fs.readFileSync('src/main/resources/fabric.mod.json', 'utf8'));
          if (!metadata.authors?.includes('TakumiStudios')) throw new Error('Missing TakumiStudios authorship');
          for (const key of ['license', 'icon', 'contact']) {
            if (!metadata[key]) throw new Error(`Missing metadata: ${key}`);
          }
          for (const file of ['README.md', 'LICENSE', 'CHANGELOG.md', 'SECURITY.md', 'MIXINS.md']) {
            if (!fs.existsSync(file)) throw new Error(`Missing file: ${file}`);
          }
          if (!fs.readFileSync('README.md', 'utf8').includes('TakumiStudios')) throw new Error('Missing README authorship');
          JS

      - name: Code hygiene
        run: |
          fail=0
          # Nada de salida por consola ni trazas sueltas: todo pasa por el logger del mod
          if grep -rnE 'System\.(out|err)\.print|\.printStackTrace\(\)' src/main src/client src/native 2>/dev/null; then
            echo "::error::usa el logger del mod en lugar de System.out/err o printStackTrace"; fail=1
          fi
          # Si hay mixins, deben estar documentados
          if [ -n "$(find src -name '*.mixins.json' 2>/dev/null)" ] && [ ! -f MIXINS.md ]; then
            echo "::error::el mod usa mixins y falta MIXINS.md"; fail=1
          fi
          exit $fail

      - name: Translations (en_us y es_es con las mismas claves)
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            let fail = false;
            const ls = d => fs.existsSync(d) ? fs.readdirSync(d) : [];
            const dirs = ls("src").flatMap(s => ls(`src/${s}/resources/assets`).map(ns => `src/${s}/resources/assets/${ns}/lang`));
            for (const dir of dirs.filter(d => fs.existsSync(d))) {
              const load = f => JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              if (!fs.existsSync(path.join(dir, "en_us.json"))) continue;
              const base = Object.keys(load("en_us.json"));
              if (!fs.existsSync(path.join(dir, "es_es.json"))) { console.log(`::error::falta ${dir}/es_es.json`); fail = true; }
              for (const f of fs.readdirSync(dir).filter(f => f.endsWith(".json") && f !== "en_us.json")) {
                const keys = new Set(Object.keys(load(f)));
                const missing = base.filter(k => !keys.has(k));
                if (missing.length) { console.log(`::error file=${dir}/${f}::faltan ${missing.length} claves: ${missing.slice(0, 10).join(", ")}`); fail = true; }
              }
            }
            process.exit(fail ? 1 : 0);
          '

      - uses: gradle/actions/wrapper-validation@v6

  test:
    name: MC ${{ matrix.minecraft }}${{ matrix.compat && ' (compat pack)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.21.1", "26.1.2", "26.2", "26.3"]
        # Sin compat pack: compat: [false]
        compat: [false, true]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and unit tests
        if: ${{ !matrix.compat }}
        run: ./gradlew :${{ matrix.minecraft }}:build --stacktrace

      - name: Server gametests
        run: ./gradlew :${{ matrix.minecraft }}:runGameTest ${{ matrix.compat && '-PcompatPack' || '' }} --stacktrace

      - name: Upload jar
        if: ${{ !matrix.compat }}
        uses: actions/upload-artifact@v7
        with:
          name: takumi_gate-mc${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/*.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-sources.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-api.jar
          if-no-files-found: error

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-mc${{ matrix.minecraft }}${{ matrix.compat && '-compat' || '' }}
          path: |
            versions/${{ matrix.minecraft }}/build/reports/
            versions/${{ matrix.minecraft }}/build/run/gameTest/logs/
          if-no-files-found: ignore

  client:
    name: Client test MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    # Si el juego se cuelga (p. ej. sin contexto gráfico), el job no puede bloquear la CI
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Sin 1.21.1: su API de tests de cliente no existe
        minecraft: ["26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils mesa-vulkan-drivers vulkan-tools

      - name: Graphics diagnostics
        continue-on-error: true
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render" glxinfo -B || true
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render" vulkaninfo --summary || true

      - name: Client gametest
        env:
          # Renderizado por software (Mesa): 26.3 necesita un visual GLX de 24 bits y acaba usando Vulkan con lavapipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          TAKUMI_INSTANCE_VERSION: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render" ./gradlew :${{ matrix.minecraft }}:runClientGameTest --stacktrace

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/run/clientGameTest/screenshots/
          if-no-files-found: ignore

      - name: Upload client logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: client-logs-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/run/clientGameTest/logs/
          if-no-files-found: ignore

  native:
    name: ${{ matrix.loader }} MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.21.1", "26.1.2", "26.2", "26.3"]
        loader: [forge, neoforge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and unit tests
        run: ./gradlew :${{ matrix.minecraft }}-${{ matrix.loader }}:build --stacktrace
      - name: Login against a dedicated server
        run: >-
          python3 scripts/smoke_login.py
          --run-dir versions/${{ matrix.minecraft }}-${{ matrix.loader }}/run
          -- ./gradlew :${{ matrix.minecraft }}-${{ matrix.loader }}:runServer --console=plain
      - name: Install client graphics runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Client startup and networking mixins
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render"
          ./gradlew :${{ matrix.minecraft }}-${{ matrix.loader }}:runClient -PgateClientSmoke --console=plain
      - name: Check client result
        run: >-
          python3 -c 'import json; from pathlib import Path;
          assert json.loads(Path("versions/${{ matrix.minecraft }}-${{ matrix.loader }}/run/takumi-client-smoke.json").read_text())["success"]'
      - uses: actions/upload-artifact@v7
        with:
          name: takumi_gate-${{ matrix.loader }}-mc${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}-${{ matrix.loader }}/build/libs/*.jar
            !versions/${{ matrix.minecraft }}-${{ matrix.loader }}/build/libs/*-sources.jar
            !versions/${{ matrix.minecraft }}-${{ matrix.loader }}/build/libs/*-dev.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}-${{ matrix.loader }}/run/smoke-console.log
            versions/${{ matrix.minecraft }}-${{ matrix.loader }}/run/logs/
            versions/${{ matrix.minecraft }}-${{ matrix.loader }}/build/reports/

  packaged:
    name: Packaged ${{ matrix.platform }} ${{ matrix.loader }} MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: quilt, loader: fabric, minecraft: "1.21.1", java: 21, node: "1.21.1"}
          - {platform: quilt, loader: fabric, minecraft: "26.1.2", java: 25, node: "26.1.2"}
          - {platform: quilt, loader: fabric, minecraft: "26.2", java: 25, node: "26.2"}
          - {platform: quilt, loader: fabric, minecraft: "26.3", java: 25, node: "26.3"}
          - {platform: arclight, loader: fabric, minecraft: "1.21.1", java: 21, node: "1.21.1"}
          - {platform: arclight, loader: forge, minecraft: "1.21.1", java: 21, node: "1.21.1-forge"}
          - {platform: arclight, loader: neoforge, minecraft: "1.21.1", java: 21, node: "1.21.1-neoforge"}
          - {platform: arclight, loader: fabric, minecraft: "26.1.2", java: 25, node: "26.1.2"}
          - {platform: arclight, loader: forge, minecraft: "26.1.2", java: 25, node: "26.1.2-forge"}
          - {platform: arclight, loader: neoforge, minecraft: "26.1.2", java: 25, node: "26.1.2-neoforge"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build distributable
        run: ./gradlew :${{ matrix.node }}:build --stacktrace
      - name: Select game Java
        run: echo "GAME_JAVA=${JAVA_HOME_${{ matrix.java }}_X64}/bin/java" >> "$GITHUB_ENV"
      - name: Install upstream server and mod
        run: >-
          python3 scripts/prepare_test_server.py
          --platform ${{ matrix.platform }} --loader ${{ matrix.loader }}
          --minecraft ${{ matrix.minecraft }} --java "$GAME_JAVA"
      - name: Verify packaged login
        run: >-
          python3 scripts/smoke_login.py
          --run-dir build/server-tests/${{ matrix.platform }}-${{ matrix.loader }}-${{ matrix.minecraft }}
          --cwd build/server-tests/${{ matrix.platform }}-${{ matrix.loader }}-${{ matrix.minecraft }}
          -- "$GAME_JAVA" -Xmx2G -jar server-launch.jar nogui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-${{ matrix.platform }}-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: build/server-tests/**/smoke-console.log

  dev-release:
    name: Publish dev build
    # Solo en pushes a main y solo si todas las pruebas pasaron
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Sin test de cliente: needs: [standards, test]
    needs: [standards, test, client, native, packaged]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Nunca dos dev-releases a la vez (borrar + crear no es atómico)
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: takumi_gate-*
          path: jars
          merge-multiple: true

      - name: Replace the "dev" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev jars/*.jar \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dev build ($(echo "$GITHUB_SHA" | cut -c1-7))" \
            --notes "Build automática de la rama main, generada tras pasar todas las pruebas en MC 1.21.1, 26.1.2, 26.2 y 26.3.

          Puede tener cambios sin publicar oficialmente. Elige el jar de tu versión y cargador. Fabric y Quilt necesitan Fabric API; Forge y NeoForge tienen jars propios. Consulta README.md para Arclight.

          Commit: $GITHUB_SHA

          Creado por TakumiStudios."
